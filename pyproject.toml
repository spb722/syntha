[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syntha"
version = "0.1.0"
description = "Synthetic data generation and evaluation toolkit"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Syntha Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pandas>=2.0.0",
    "ollama>=0.1.0",
    "deepeval>=0.20.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
syntha-generate = "syntha.generator:main"
syntha-extract = "syntha.extractor:main"
syntha-evaluate = "syntha.evaluation.runner:main"
syntha-filter = "syntha.evaluation.filter:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py312"]
