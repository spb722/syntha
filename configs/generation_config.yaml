# Synthetic Data Generation Configuration

model:
  name: "glm-4.6:cloud"
  host: "http://localhost:11434"
  timeout: 60

sampling:
  simple_kpis: 1
  medium_kpis: 3
  complex_kpis: 5

output:
  directory: "outputs/datasets"
  format: "jsonl"
  include_metadata: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
